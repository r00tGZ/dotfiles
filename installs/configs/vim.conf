" General
set number						" Line numbers
set nowrap						" No line wrapping
set showmatch					" Highlight matching bracket
set confirm						" Confirm risky actions
set mouse=a						" Enable mouse
set background=light			" Light background
set autoread					" Reload external changes

" Indentation
set autoindent					" Copy previous indent
set expandtab					" Spaces instead of tabs
set tabstop=4					" Tab width
set shiftwidth=4				" Indent width
set softtabstop=4				" Tab key width
filetype plugin indent on		" Filetype-aware indent

" Search
set hlsearch					" Highlight matches
set incsearch					" Search while typing
set ignorecase					" Ignore case by default
set smartcase					" Respect uppercase queries

" Interface
set errorbells					" Signal errors
set visualbell					" Use visual bell
set ruler						" Show cursor position
set showcmd						" Show partial commands
set wildmenu					" Completion menu
set wildmode=longest:full,full	" Smarter completion
set scrolloff=5					" Keep vertical context
set laststatus=2				" Always show status line
set showtabline=0				" Hide tab bar
syntax on						" Enable syntax highlighting

" Mappings
nnoremap Y y$
