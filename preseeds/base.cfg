#_preseed_V1

### Localization

d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/shortlist select US
d-i localechooser/preferred-locale select en_US.UTF-8
d-i localechooser/languagelist select en
d-i keyboard-configuration/xkb-keymap select es

### Network

d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string

### Clock

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Madrid
d-i clock-setup/ntp boolean true

### User

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string toor
d-i passwd/username string toor

# Public, disposable bootstrap password.
d-i passwd/user-password password s3cr3t
d-i passwd/user-password-again password s3cr3t

### Packages

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i pkgsel/include string ca-certificates curl git iputils-ping sudo tmux tree vim zsh

### Completion

d-i finish-install/reboot_in_progress note
