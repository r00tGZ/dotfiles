#_preseed_V1
# Debian 13 (trixie) Installer (amd64), bare-metal desktop, Internet access.
# Disk choices, credentials and bootloader settings are deliberately not preseeded.
# Boot with auto=true priority=high url=...; see README.md.

# Keep normal installer questions; this is not an unattended installation.
d-i debconf/priority select high

# English system, Spanish keyboard, Spain.
d-i debian-installer/language string en
d-i debian-installer/country string ES
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select es

# Networking; ask for the hostname and any required wireless credentials.
d-i netcfg/choose_interface select auto

# Ask for the user account; root login disabled, administration through sudo.
d-i passwd/root-login boolean false

# Clock; leave the hardware clock's UTC/local-time choice to the installer.
d-i time/zone string Europe/Madrid
d-i clock-setup/ntp boolean true

# Partitioning is entirely interactive: no disk, recipe or write confirmations.
# Review the selected disks, mount points and any existing EFI partition.

# Debian mirror; firmware and updates, no proxy or additional installation media.
d-i mirror/protocol string http
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

# Full Xfce desktop by default; keep the software selection screen editable.
tasksel tasksel/first multiselect standard, desktop, xfce-desktop
tasksel tasksel/first seen false
d-i pkgsel/include string curl git sudo tmux vim zsh

# GRUB and the final reboot follow the normal installer workflow.
# No boot device is forced and the completion prompt is not suppressed.
