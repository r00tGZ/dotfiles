#_preseed_V1
# Debian 13 (trixie) Installer (amd64), VirtualBox: one SATA disk, NAT/DHCP, Internet access.
# WARNING: automatically erases /dev/sda. Disposable VM only; login toor / toor.
# Start through Advanced options -> Automated install, then load this file.

# English system, Spanish keyboard, Spain.
d-i debian-installer/language string en
d-i debian-installer/country string ES
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select es

# Networking.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-vm
d-i netcfg/get_domain string
d-i netcfg/hostname string debian-vm

# User account; root login disabled, administration through sudo.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Toor
d-i passwd/username string toor
d-i passwd/user-password password toor
d-i passwd/user-password-again password toor

# Clock.
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Madrid
d-i clock-setup/ntp boolean true

# Entire disk; ordinary partitions, one root filesystem plus swap.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

# Permit removal of old LVM/RAID metadata during reinstalls.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true

# Confirm partitioning automatically.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Debian mirror and updates; no proxy or additional installation media.
d-i mirror/protocol string http
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/services-select multiselect security, updates

# Standard tools, Xfce, browser and editors; omit the full desktop task's extras.
# Keep normal package recommendations. VirtualBox guest additions are optional.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string curl git sudo tmux vim zsh xfce4 xfce4-terminal lightdm firefox-esr mousepad

# Install GRUB.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda

# Power off when finished.
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
