#_preseed_V1
# Debian 13 amd64 netinst, VirtualBox with NAT and one SATA disk.
# Unattended install: erases /dev/sda, creates toor/toor, then powers off.

# English desktop, Spanish keyboard, Madrid time.
d-i debian-installer/language string en
d-i debian-installer/country string ES
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i time/zone string Europe/Madrid
d-i clock-setup/utc boolean true

# DHCP for the guest; fetch packages from the Debian mirror.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-vm
d-i netcfg/get_domain string
d-i netcfg/hostname string debian-vm
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie

# Disable root login. Debian gives the first user sudo access.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Toor
d-i passwd/username string toor
d-i passwd/user-password password toor
d-i passwd/user-password-again password toor

# Guided partitioning on the VM disk, including reinstalls over old LVM or RAID.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-md/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Standard utilities and a small Xfce desktop with the usual editors and shell tools.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string xfce4 lightdm xfce4-terminal firefox-esr mousepad vim curl git sudo tmux zsh

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
